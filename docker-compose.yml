services:
  postgres:
    image: postgres:15
    container_name: first-birthday-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=first_birthday
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: first-birthday-app
    ports:
      - "3002:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/first_birthday
      # Public address of the site, used for link previews (og:image).
      # - SITE_URL=https://your-domain.example
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
